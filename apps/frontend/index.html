<!doctype html>
<!-- Startup adapted from zool-theme/index.html (MIT, luoleiorg). -->
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="description" content="Live server status and performance" />
        <title></title>
        <link rel="icon" href="/assets/apple-touch-icon.svg" type="image/svg+xml" />
        <link rel="apple-touch-icon" sizes="512x512" href="/assets/apple-touch-icon-512.png" />
        <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
        <script>
            // Resolve appearance and cached site title before first paint.
            ;(function () {
                var root = document.documentElement
                var stored = null
                try {
                    stored = localStorage.getItem("nkt:appearance")
                    var title = localStorage.getItem("nkt:site-title")
                    if (title) document.title = title
                } catch (e) {}
                var mode = stored === "light" || stored === "dark" ? stored : "system"
                var dark =
                    mode === "dark" ||
                    (mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches)
                root.dataset.mode = dark ? "dark" : "light"
                root.style.colorScheme = dark ? "dark" : "light"
            })()
        </script>
        <script>
            // A previous theme's PWA service worker can keep serving its own precached
            // index.html (which points at assets that no longer exist). Drop it once.
            ;(function () {
                if (!("serviceWorker" in navigator)) return
                navigator.serviceWorker
                    .getRegistrations()
                    .then(function (regs) {
                        regs = regs.filter(function (r) {
                            return new URL(r.scope).pathname === "/"
                        })
                        if (!regs.length) return
                        Promise.all(
                            regs.map(function (r) {
                                return r.unregister()
                            }),
                        )
                            .then(function () {
                                return window.caches
                                    ? caches.keys().then(function (k) {
                                          return Promise.all(
                                              k
                                                  .filter(function (n) {
                                                      return /^(zool|nezha-kumo|workbox-precache)/.test(
                                                          n,
                                                      )
                                                  })
                                                  .map(function (n) {
                                                      return caches.delete(n)
                                                  }),
                                          )
                                      })
                                    : null
                            })
                            .then(function () {
                                try {
                                    if (sessionStorage.getItem("nkt:sw-cleared")) return
                                    sessionStorage.setItem("nkt:sw-cleared", "1")
                                } catch (e) {}
                                try {
                                    if (sessionStorage.getItem("nkt:sw-cleared") === "1")
                                        location.reload()
                                } catch (e) {}
                            })
                    })
                    .catch(function () {})
            })()
        </script>
        <script src="/config.js"></script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
