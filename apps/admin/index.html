<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="shortcut icon" type="image/svg+xml" href="/logo.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>哪吒监控 Nezha Monitoring</title>
        <script>
            // Resolve theme before first paint to prevent dark-mode white flash.
            // Canonical constants & logic live in src/components/theme-provider.tsx
            // (THEME_STORAGE_KEY, THEME_VALUES, DEFAULT_THEME, resolveTheme, applyResolvedTheme).
            ;(function () {
                var root = document.documentElement
                var stored = null
                try {
                    stored = localStorage.getItem("vite-ui-theme")
                } catch (e) {}
                var theme =
                    stored === "light" || stored === "dark" || stored === "system"
                        ? stored
                        : "system"
                var resolved =
                    theme === "system"
                        ? typeof matchMedia === "function" &&
                          matchMedia("(prefers-color-scheme: dark)").matches
                            ? "dark"
                            : "light"
                        : theme
                root.classList.remove("light", "dark")
                root.classList.add(resolved)
                root.dataset.mode = resolved
                root.style.colorScheme = resolved
            })()
        </script>
    </head>

    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
