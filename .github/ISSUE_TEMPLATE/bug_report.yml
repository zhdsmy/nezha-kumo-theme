name: Bug Report
description: Report a bug in the Nezha Kumo user frontend or admin panel
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - User Frontend (nezha-kumo-theme)
        - Admin Panel (nezha-kumo-admin)
        - Both / Shared Shell
    validations:
      required: true
  - type: input
    id: nezha-version
    attributes:
      label: Nezha Version
      description: Version of Nezha Dashboard running on your server.
      placeholder: v2.6.1
    validations:
      required: true
  - type: input
    id: theme-version
    attributes:
      label: Theme Version
      description: Release tag or commit SHA installed.
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      description: Browser name and version.
      placeholder: Chrome 136 / Safari 18.4 / Firefox 138
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device & OS
      description: Device model / form factor, OS version, and approximate viewport width if layout-related.
      placeholder: macOS 15 Desktop (1440x900) / iPhone 16 iOS 18.4
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the issue (please redact real domains, IPs, or tokens).
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Observe '...'
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected vs. Actual Behavior
      description: What did you expect to happen, and what happened instead? Attach screenshots or console errors if applicable.
    validations:
      required: true
